<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coworking</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: 'Arial', sans-serif;
        touch-action: none;
    }

    #viewer {
        position: absolute;
        inset: 0;
    }

    .label {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: rgba(0,0,0,0.6);
        padding: 10px 30px;
        border-radius: 40px;
        font-weight: bold;
        z-index: 100;
        text-transform: uppercase;
        border: 1px solid rgba(255,255,255,0.2);
        pointer-events: none;
    }

    #menu {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 999;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.85);
        border-radius: 50px;
        overflow-x: auto;
        max-width: 90vw;
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        padding-bottom: 12px;
    }

    #menu::-webkit-scrollbar {
        height: 7px;
    }

    #menu::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        margin: 0 25px;
    }

    #menu::-webkit-scrollbar-thumb {
        background: #0D47A1;
        border-radius: 10px;
    }

    #menu button {
        cursor: pointer;
        white-space: nowrap;
        color: white;
        font-weight: bold;
        font-size: 13px;
        padding: 10px 22px;
        background: rgba(255,255,255,0.1);
        border-radius: 25px;
        border: 1px solid transparent;
        transition: all 0.3s;
    }

    #menu button:hover {
        background: rgba(255,255,255,0.2);
    }

    #menu button.active {
        background: #0D47A1;
        border-color: #fff;
    }

    .pnlm-lmsg,
    .pnlm-lbox-icon {
        display: none !important;
    }

    .pnlm-load-box {
        background: transparent !important;
        box-shadow: none !important;
        width: auto !important;
    }

    .pnlm-lbar-container {
        width: 220px !important;
    }

    .pnlm-lbar {
        height: 4px !important;
        background: rgba(255,255,255,0.15) !important;
        border-radius: 4px !important;
        overflow: hidden;
        border: none !important;
    }

    .pnlm-lbar-fill {
        background: #0D47A1 !important;
    }

    .pnlm-about-msg {
        display: none !important;
    }

    .pnlm-controls-container {
        pointer-events: none;
    }

    #menu,
    #menu button {
        pointer-events: auto;
    }
</style>
</head>

<body>

<div class="label" id="t">ENTRANCE</div>

<div id="viewer"></div>

<div id="menu"></div>

<script>

const scenes = {

    entrance: {
        title: "Entrance",
        panorama: "entrance.jpeg",
        yaw: -12,
        pitch: 5
    },

    hall: {
        title: "Hall",
        panorama: "hall.jpeg",
        yaw: -25,
        pitch: -5
    },

    boss: {
        title: "Boss",
        panorama: "boss.jpeg",
        yaw: -165,
        pitch: -10
    },

    team: {
        title: "Team",
        panorama: "team.jpeg",
        yaw: -50,
        pitch: 0
    },

    power: {
        title: "Power",
        panorama: "power.jpeg",
        yaw: 175,
        pitch: -15
    },

    ceo: {
        title: "CEO",
        panorama: "ceo.jpeg",
        yaw: 179,
        pitch: -10
    },

    pro1: {
        title: "Pro 1",
        panorama: "pro1.jpeg",
        yaw: 0,
        pitch: 0
    },

    pro2: {
        title: "Pro 2",
        panorama: "pro2.jpeg",
        yaw: 0,
        pitch: 0
    }

};


const isDesktop = window.innerWidth > 768;

const defaultHfov = isDesktop ? 115 : 100;
const maxHfov = isDesktop ? 130 : 120;


const viewer = pannellum.viewer('viewer', {

    default: {
        firstScene: 'entrance',
        sceneFadeDuration: 800,
        autoLoad: true,
        hfov: defaultHfov,
        maxHfov: maxHfov,
        showControls: true
    },

    scenes: scenes

});


const menu = document.getElementById('menu');
const t = document.getElementById('t');


function blockContextMenu(e) {

    e.preventDefault();
    e.stopPropagation();

    if (e.stopImmediatePropagation) {
        e.stopImmediatePropagation();
    }

    return false;
}


document
    .getElementById('viewer')
    .addEventListener('contextmenu', blockContextMenu, true);

document
    .addEventListener('contextmenu', blockContextMenu, true);


function setActive(btn) {

    document
        .querySelectorAll('#menu button')
        .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');
}


for (const key in scenes) {

    const btn = document.createElement('button');

    btn.textContent = scenes[key].title;

    if (key === 'entrance') {
        btn.classList.add('active');
    }

    btn.onclick = () => {

        viewer.loadScene(key);

        t.textContent =
            scenes[key].title.toUpperCase();

        setActive(btn);

    };

    menu.appendChild(btn);
}

</script>

</body>
</html>
